<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
    <meta name="viewport"content="width=device-width,initial-scale=1.0>
  <title> صفحتي الاولي </title>
  <style>
    body {
        background-color:#F2F6FF;
        font-family:arial;
        text-align:center;
    }
    h1 {
        color:#2c3e50;
    }
p {
    color:#555;
    font-size:18px;
}
img {
    display:block;
    margin:20px auto;
    border-radius:10px;
}
    .form-box {
        background:white;
        width:350px;
        margin:30px auto;
        padding:20px;
        border-radius:10px;
        box-shadow:0 0 10px rgba(0,0,0,0.1);
        text-align:left;
    }
    .form-box h2 {
        text-align:center;
    }
    label{
        font-weight:bold;
    }
    input, textarea {
        width:100%;
        padding:10px;
        margin-top:5px;
        margin-bottom:15px;
        border:1px solid #ccc;
        border-radius:5px;
    }
    button {
        width:100%;
        padding:10px;
        background: color #4a6cf7;
        color:white;
        border:none;
        border-radius:5px;
        font-size:16px;
        cursor:pointer;
    }
    button:hover{
        background-color:#3b5bdb;
    }
    @media (max-width:600px)
        body {
            padding:10px;
        }
        h1 {
            font-size:16px;
        }
        p {
            .form-box {
                width:100%;
                padding:15px;
            }
        }
</style>
</head>
    <body>
        <h1>اهلا وسهلا</h1>
        <p>انا اتعلم html و css واطمح للعمل من البيت </p>
<img src="photo.jpg" width="300" alt=""صورتي>
<div class="form-box">
<h2>تواصل معي</h2>
<form onsubmit="sendMessage(event)">
    <label>الاسم:</label><br>
    <input type="text"placeholder="اكتب اسمك"><br><br>
    <label>البريد الالكتروني:</label><br>
    <input type="email"placeholder="example@email.com"><br><br>
    <label>رسالتك:</label><br>
    <textarea rows="4" placeholder="اكتب رسالتك هنا"></textarea><br><br>
    <button>ارسال</button>
</form>
</div>
<script>
    function sendMessage(event){
        event.preventDefault();
        alert("تم ارسال الرساله بنجاح");
    }
</script>
</body>
</html>
